[program:huey]
directory=/srv/my_app
; Run the consumer directly (no shell-script wrappers) so that signals
; are delivered to the Python process. See github issue #88.
command=/srv/my_app/venv/bin/huey_consumer my_app.huey -w 4 -k thread -t 55
user=appuser
autostart=true
autorestart=true

; Huey shuts down gracefully on SIGINT. Supervisor's default stopsignal is
; TERM, which huey treats as "stop immediately", so use INT (or run the
; consumer with -g TERM instead and drop this line).
stopsignal=INT
; SIGKILL deadline. The consumer's -t 55 interrupts any still-running tasks
; just before this, emitting SIGNAL_INTERRUPTED, so nothing is lost to
; SIGKILL.
stopwaitsecs=60

stdout_logfile=/var/log/huey/stdout.log
stderr_logfile=/var/log/huey/stderr.log
environment=PYTHONUNBUFFERED="1"
